<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Verify Certificate</title>

    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
</head>

<body>

<h1>Verify Certificate</h1>

<form
    hx-post="/certificates/verify"
    hx-target="#result"
    hx-encoding="multipart/form-data">

    <input
        type="file"
        name="pdf"
        required>

    <button type="submit">
        Verify Certificate
    </button>

</form>

<hr>

<div id="result"></div>

</body>
</html>
