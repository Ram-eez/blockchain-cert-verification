<!DOCTYPE html>
<html>
<head>
    <title>Institute Login</title>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    {{ template "theme_assets" . }}
</head>
<body>
<main class="page-shell">
    <section class="center-panel">
        <header class="page-header">
            <p class="eyebrow">Institute Access</p>
            <h1>Institute Login</h1>
            <p>Sign in to issue and revoke certificates from the authorized institute account.</p>
        </header>

        <section class="panel">
            <form
                hx-post="/login"
                hx-target="#result"
                autocomplete="off">

                <div class="field">
                    <label for="login-email">Email</label>
                    <input
                        id="login-email"
                        type="email"
                        name="email"
                        placeholder="Email"
                        autocomplete="off"
                        required>
                </div>

                <div class="field">
                    <label for="login-password">Password</label>
                    <input
                        id="login-password"
                        type="password"
                        name="password"
                        placeholder="Password"
                        autocomplete="off"
                        required>
                </div>

                <button type="submit">
                    Login
                </button>
            </form>
        </section>

        <div id="result"></div>
    </section>
</main>
{{ template "reset_forms_script" . }}
</body>
</html>
