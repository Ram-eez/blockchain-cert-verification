<!DOCTYPE html>
<html>

<head>
    <title>Institute Login</title>

    <script src="https://unpkg.com/htmx.org@2.0.4"></script>

</head>

<body>

<h1>Institute Login</h1>

<form
    hx-post="/login"
    hx-target="#result">

    <input
        type="email"
        name="email"
        placeholder="Email"
        required>

    <br>

    <input
        type="password"
        name="password"
        placeholder="Password"
        required>

    <br>

    <button>
        Login
    </button>

</form>

<div id="result"></div>

</body>
</html>
